<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">MCP9700 pinout, SOT-23-3</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses for it.</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">Datasheet: Package Types, p. 2.</text>
