<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the MCP9700 does</title>
<desc id="chip-capabilities-desc">Capability map of the MCP9700: Linear temperature output (supported): Turns the output voltage into milli-degrees with the datasheet's first-order equation, in integers; Five devices (supported): The MCP9700, 9700A, 9700B, 9701 and 9701A with their slopes, offsets, ranges and accuracy grades; Temperature classes (supported): Extended range, or +150 °C on the MCP9700 and MCP9700B High option; a reading outside it is refused; Direct ADC connection (supported): VOUT goes straight to an ADC pin; the driver averages conversions and refuses a clipped or noisy line; One-point calibration (supported): Removes the sensor's offset with one reading at a known temperature, as the datasheet advises; Power from an I/O pin (supported): Switches the sensor's supply from an MCU pin to save current; 800 µs typical turn-on; Nonlinearity compensation (not covered): A look-up table can bring the accuracy to ±0.5 °C typical; the driver leaves the ±0.5 °C curve in the result; Self-heating (not covered): 0.179 °C at the worst case at 25 °C; the driver does not correct it.</desc>
