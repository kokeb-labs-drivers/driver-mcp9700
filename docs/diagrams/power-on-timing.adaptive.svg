<text x="195.1" y="301.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">tON</text>
<text x="32" y="349.3" font-size="17" font-weight="700" class="fk-f-ink">Timing values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tON</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 800 µs</text>
<text x="32" y="405.9" font-size="15" class="fk-f-ink2">Turn-on time (typical; the datasheet gives no maximum)</text>
<text x="32" y="426.1" font-size="14" class="fk-f-muted">Datasheet DC Electrical Characteristics (t_ON), p. 4</text>
<text x="46" y="480.2" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="500.7" font-size="15" class="fk-f-slate-text">An MCU I/O pin may supply the sensor; filter its switching noise with a</text>
<text x="46" y="522.4" font-size="15" class="fk-f-slate-text">series resistor and a decoupling capacitor. The driver waits</text>
<text x="46" y="544.2" font-size="15" class="fk-f-slate-text">Config::power_on_settle_us, a multiple of the typical turn-on time.</text>
