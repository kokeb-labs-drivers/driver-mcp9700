<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="689" viewBox="0 0 1200 689" role="img" aria-labelledby="chip-wiring-gpio-powered-title chip-wiring-gpio-powered-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-gpio-powered-title">Wiring: Powered from an I/O pin</title>
<desc id="chip-wiring-gpio-powered-desc">Wiring of the MCP9700 for the Powered from an I/O pin: MCU ADC input to VOUT (ReadVoltageMv()); MCU GPIO (enable) to VDD through R1 200 Ω (GpioSet(CtrlPin::Enable)). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="688" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Powered from an I/O pin</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: 4.2 Shutdown Using Microcontroller I/O Pin, p. 11.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M437.9 280.3 L708.1 280.3" fill="none" stroke="#A21CAF" stroke-width="2.2"/>
<path d="M437.9 365.9 L708.1 365.9" fill="none" stroke="#DB2752" stroke-width="2.2"/>
<rect x="722.1" y="175.5" width="240" height="251.2" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="237.9" y="175.5" width="200" height="251.2" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="454.7" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="547.7" width="1136" height="79" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="842.1" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">MCP9700</text>
<text x="842.1" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="255.9" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="255.9" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="419.9" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">ADC input</text>
<text x="744.1" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VOUT</text>
<rect x="708.1" y="274.3" width="14" height="12" rx="2" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">VOUT  pin 2</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">ReadVoltageMv()</text>
<text x="419.9" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">GPIO (enable)</text>
<text x="744.1" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VDD</text>
<rect x="708.1" y="359.9" width="14" height="12" rx="2" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">VDD  pin 1</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">GpioSet(CtrlPin::Enable)</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">through R1 200 Ω</text>
<text x="573" y="431.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ C1 1 µF</text>
<text x="50" y="489.7" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="513.1" font-size="17" fill="#9F1239">GND: GND; also U2.GND</text>
<text x="50" y="582.7" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="606.1" font-size="17" fill="#334155">Support parts: 1 capacitor, 1 resistor around the supplies (values in the full schematic).</text>
