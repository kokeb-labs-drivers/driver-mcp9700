<svg xmlns="http://www.w3.org/2000/svg" width="954" height="1062" viewBox="0 0 954 1062" role="img" aria-labelledby="chip-pinout-title chip-pinout-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-pinout-title">MCP9700 pinout, SOT-23-3</title>
<desc id="chip-pinout-desc">Pinout of the MCP9700 in SOT-23-3, top view: 3 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
<rect x="0.5" y="0.5" width="953" height="1061" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">MCP9700 pinout, SOT-23-3</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses for it.</text>
<text x="32" y="125.5" font-size="15" fill="#566070">Datasheet: Package Types, p. 2.</text>
<rect x="32" y="141.6" width="890" height="1" fill="#E2E7EE"/>
