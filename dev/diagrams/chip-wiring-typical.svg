<text x="301.7" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="301.7" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="465.7" y="275.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">ADC input</text>
<text x="698.3" y="275.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VOUT</text>
