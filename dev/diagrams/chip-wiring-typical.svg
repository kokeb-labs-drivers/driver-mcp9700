<text x="50" y="405.9" font-size="17" fill="#9F1239">+3V3: VDD; also U2.VDD · GND: GND; also U2.GND</text>
<text x="50" y="475.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
