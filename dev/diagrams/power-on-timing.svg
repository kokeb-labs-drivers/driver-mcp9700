<svg xmlns="http://www.w3.org/2000/svg" width="640" height="591" viewBox="0 0 640 591" role="img" aria-labelledby="power-on-timing-title power-on-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="power-on-timing-title">Power-on settling</title>
<desc id="power-on-timing-desc">Power-on of an MCP9700 supplied from an MCU pin: VDD rises, VOUT is undefined for the turn-on time, then follows the transfer function and the ADC may sample it.</desc>
