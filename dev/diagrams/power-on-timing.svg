<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">Power-on settling</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Datasheet: DC Electrical Characteristics (t_ON), p. 4; 4.2 Shutdown Using</text>
<text x="32" y="124.5" font-size="15" fill="#566070">Microcontroller I/O Pin, p. 11.</text>
