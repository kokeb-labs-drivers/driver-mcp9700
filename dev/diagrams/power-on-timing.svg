<text x="430.7" y="175.8" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">ADC may sample</text>
<text x="32" y="224.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VDD</text>
<text x="32" y="272.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">VOUT</text>
<text x="430.7" y="271.7" font-size="14" font-weight="600" text-anchor="middle" fill="#0B5F59">VOUT = TC x TA + V0</text>
<text x="195.1" y="301.9" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">tON</text>
<text x="32" y="349.3" font-size="17" font-weight="700" fill="#0E1726">Timing values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tON</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">typ 800 µs</text>
<text x="32" y="405.9" font-size="15" fill="#2B3442">Turn-on time (typical; the datasheet gives no maximum)</text>
<text x="32" y="426.1" font-size="14" fill="#566070">Datasheet DC Electrical Characteristics (t_ON), p. 4</text>
<text x="46" y="480.2" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="500.7" font-size="15" fill="#334155">An MCU I/O pin may supply the sensor; filter its switching noise with a</text>
<text x="46" y="522.4" font-size="15" fill="#334155">series resistor and a decoupling capacitor. The driver waits</text>
<text x="46" y="544.2" font-size="15" fill="#334155">Config::power_on_settle_us, a multiple of the typical turn-on time.</text>
