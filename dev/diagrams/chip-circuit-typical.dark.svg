<svg xmlns="http://www.w3.org/2000/svg" width="760" height="543" viewBox="0 0 760 543" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">MCP9700: Typical application</title>
<desc id="chip-circuit-typical-desc">Schematic of the MCP9700 typical application: the chip with U2 MCU, C1 capacitor 100 nF; the MCU wires carry the port hooks GpioSet(CtrlPin::Enable), ReadVoltageMv().</desc>
<rect x="0.5" y="0.5" width="759" height="542" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">MCP9700: Typical application</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The sensor on an MCU's ADC input with a 100 nF capacitor between VDD and GND. The</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">driver reads the VOUT pin through ReadVoltageMv(). Above each MCU wire: the port hook</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">that drives it. Datasheet: 4.0 Applications Information, Figure 4-1 Typical Application Circuit,</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">p. 10.</text>
