<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Output voltage against temperature</text>
<text x="32" y="103.8" font-size="15" fill="#566070">V = V0 + TC x T (Equation 4-1). Solid: specified range. Dotted: the margin the driver accepts.</text>
