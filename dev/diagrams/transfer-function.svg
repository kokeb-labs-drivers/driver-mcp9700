<title id="transfer-function-title">Output voltage against temperature</title>
<desc id="transfer-function-desc">Chart of VOUT in millivolts against temperature from -50 to +160 degrees Celsius: the MCP9700 family at 500 mV plus 10.0 mV per degree, the MCP9701 family at 400 mV plus 19.5 mV per degree, and a Custom example, each solid over its specified range and dotted over the plausibility margin.</desc>
