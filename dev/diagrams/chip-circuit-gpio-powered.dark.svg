<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="chip-circuit-gpio-powered-title chip-circuit-gpio-powered-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-gpio-powered-title">MCP9700: Powered from an I/O pin</title>
<desc id="chip-circuit-gpio-powered-desc">Schematic of the MCP9700 powered from an i/o pin: the chip with U2 MCU, R1 resistor 200 Ω, C1 capacitor 1 µF; the MCU wires carry the port hooks GpioSet(CtrlPin::Enable), ReadVoltageMv().</desc>
<rect x="0.5" y="0.5" width="759" height="534" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">MCP9700: Powered from an I/O pin</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The sensor's supply comes from an MCU pin through 200 ohm with 1 uF at VDD, so the</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">driver can switch the sensor off with GpioSet(CtrlPin::Enable). The values are the</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">datasheet's advice for a noisy supply. Above each MCU wire: the port hook that drives it.</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">Datasheet: 4.2 Shutdown Using Microcontroller I/O Pin, p. 11.</text>
<rect x="32" y="185.1" width="696" height="1" fill="#252F3C"/>
