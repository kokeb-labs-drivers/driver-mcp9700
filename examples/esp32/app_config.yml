---
# MCP970x ESP32 examples: the app matrix read by the build scripts, the CI and the docs Examples page.
version: "1.0"

metadata:
  project: "ESP32 MCP970x Driver Examples"
  default_app: "mcp9700_basic_example"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  mcp9700_basic_example:
    description: "Initialise the sensor from menuconfig values and log the temperature twice a second"
    source_file: "mcp9700_basic_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "ESP-IDF adc_oneshot port with curve-fitting calibration and Log(); a second port adds the supply pin"
      - "Config from Kconfig (menuconfig) through mcp9700_kconfig.hpp"
      - "Every Result checked; temperature printed from integer milli-degrees"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_mcp9700_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
